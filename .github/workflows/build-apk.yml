
name: Build PHONE FOUNDRY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/PHONE_FOUNDRY_Classic_GitHub_fixed.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Project ZIP archive not found"
            find . -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p project
          unzip -oq "$ARCHIVE" -d project

          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -s project/app/src/main/assets/index.html

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is missing on the runner"
            exit 1
          fi

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -print -quit)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in Android SDK"
            exit 1
          fi

          echo "SDK manager: $SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses < /dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHONE-FOUNDRY-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
