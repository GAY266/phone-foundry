
name: Build PHONE FOUNDRY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="PHONE_FOUNDRY_Classic_GitHub_fixed.zip"
          test -f "$ARCHIVE"

          mkdir -p project
          unzip -oq "$ARCHIVE" -d project

          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -s project/app/src/main/assets/index.html

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          test -n "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" --licenses \
            || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("project/app/build.gradle")
          source = path.read_text()

          if "compileOptions" in source:
              import re
              source = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  """compileOptions {
                      sourceCompatibility JavaVersion.VERSION_17
                      targetCompatibility JavaVersion.VERSION_17
                  }""",
                  source,
                  count=1
              )
          else:
              source = source.replace(
                  "android {",
                  """android {
                      compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }""",
                  1
              )

          if "kotlinOptions" in source:
              import re
              source = re.sub(
                  r'kotlinOptions\s*\{[^}]*\}',
                  "kotlinOptions { jvmTarget = '17' }",
                  source,
                  count=1
              )
          else:
              source = source.replace(
                  "android {",
                  """android {
                      kotlinOptions {
                          jvmTarget = '17'
                      }""",
                  1
              )

          if "sourceCompatibility JavaVersion.VERSION_17" not in source:
              raise SystemExit("Failed to configure Java JVM target")
          if "jvmTarget = '17'" not in source:
              raise SystemExit("Failed to configure Kotlin JVM target")

          path.write_text(source)
          print(source)
          PY

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHONE-FOUNDRY-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
