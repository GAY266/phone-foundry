
name: Build PHONE FOUNDRY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack PHONE FOUNDRY project
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/PHONE_FOUNDRY_Classic_GitHub_fixed.zip"
          PROJECT="$GITHUB_WORKSPACE/project"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Project ZIP archive not found"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p "$PROJECT"
          unzip -oq "$ARCHIVE" -d "$PROJECT"

          test -f "$PROJECT/settings.gradle"
          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/app/src/main/assets/index.html"

          echo "Project successfully unpacked"
          find "$PROJECT/app/src/main" -maxdepth 4 -type f

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="project/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHONE-FOUNDRY-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
