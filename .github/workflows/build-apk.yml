
name: Build PHONE FOUNDRY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not configured"
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            echo "::error::Android SDK platform-tools not found"
            exit 1
          fi

      - name: Prepare PHONE FOUNDRY HTML
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets

          if [ -f "phone_foundry.html" ]; then
            cp phone_foundry.html app/src/main/assets/index.html
            echo "Copied root HTML into Android assets"

          elif [ -f "app/src/main/assets/index.html" ]; then
            echo "Using existing Android assets/index.html"

          else
            echo "::error::PHONE FOUNDRY HTML file was not found"
            echo "Files in repository:"
            find . -maxdepth 5 -type f \
              -not -path './.git/*' | sort
            exit 1
          fi

          test -s app/src/main/assets/index.html

      - name: Check Android SDK packages
        run: |
          test -d "$ANDROID_HOME/platforms" || {
            echo "::error::Android SDK platforms directory is missing"
            exit 1
          }

          ls -la "$ANDROID_HOME/platforms"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHONE-FOUNDRY-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
