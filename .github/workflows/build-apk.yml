
name: PHONE FOUNDRY - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "Android SDK:"
          ls -la "$ANDROID_HOME"
          echo "SDK Manager:"
          find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses || true

      - name: Install SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platform-tools"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project
        run: |
          find . -maxdepth 4 -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) -print

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PHONE-FOUNDRY-1.2.0-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
